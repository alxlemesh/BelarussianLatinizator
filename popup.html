<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belarusian Łacinka Converter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🇧🇾 <span data-i18n="appTitle">Łacinka Converter</span></h1>
        <p class="subtitle" data-i18n="appSubtitle">
          Belarusian Cyrillic to Latin
        </p>

        <!-- Language Selector -->
        <div class="language-selector">
          <button class="lang-btn" data-lang="be-latn">Be ł</button>
          <button class="lang-btn" data-lang="be">Бел</button>
          <button class="lang-btn" data-lang="en">Eng</button>
        </div>
      </header>

      <main>
        <!-- Global Toggle -->
        <div class="control-group">
          <div class="toggle-container">
            <label class="toggle-label">
              <input type="checkbox" id="globalToggle" class="toggle-input" />
              <span class="toggle-slider"></span>
              <span class="toggle-text" data-i18n="extensionEnabled"
                >Extension Enabled</span
              >
            </label>
          </div>
        </div>

        <!-- Auto-Translate Toggle -->
        <div class="control-group">
          <div class="toggle-container">
            <label class="toggle-label">
              <input
                type="checkbox"
                id="autoTranslateToggle"
                class="toggle-input"
              />
              <span class="toggle-slider"></span>
              <span class="toggle-text" data-i18n="autoTranslate"
                >Auto-translate to Belarusian (Beta)</span
              >
            </label>
            <p class="toggle-hint" data-i18n="autoTranslateHint">
              Translates non-Belarusian text to Belarusian using Google
              Translate, then converts to Łacinka
            </p>
          </div>
        </div>

        <!-- Current Site Controls -->
        <div class="control-group">
          <h2 data-i18n="currentSite">Current Site</h2>
          <div id="currentSiteInfo">
            <p class="site-url" id="currentUrl">Loading...</p>
            <div class="site-controls">
              <button
                id="enableSite"
                class="btn btn-primary"
                data-i18n="enableTranslation"
              >
                Enable Translation
              </button>
              <button
                id="disableSite"
                class="btn btn-secondary"
                data-i18n="disableTranslation"
              >
                Disable Translation
              </button>
            </div>
          </div>
        </div>

        <!-- Enabled Sites List -->
        <div class="control-group">
          <h2 data-i18n="enabledSites">Enabled Sites</h2>
          <div id="enabledSitesList" class="sites-list">
            <p class="empty-state" data-i18n="noSitesEnabled">
              No sites enabled yet
            </p>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="control-group">
          <h2 data-i18n="actions">Actions</h2>
          <div class="action-buttons">
            <button id="refreshPage" class="btn btn-action">
              🔄 <span data-i18n="refreshPage">Refresh Page</span>
            </button>
            <button id="clearAllSites" class="btn btn-danger">
              🗑️ <span data-i18n="clearAllSites">Clear All Sites</span>
            </button>
          </div>
        </div>
      </main>

      <footer>
        <p class="version">v1.0.0</p>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
